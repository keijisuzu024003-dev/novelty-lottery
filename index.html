<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 会場でのタップ操作前提。ピンチズームやダブルタップ拡大は誤操作の元なので禁止する -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0A09">
<link rel="manifest" href="manifest.webmanifest">
<title>ノベルティ抽選</title>
<link rel="stylesheet" href="app.css">
</head>
<!-- 画面の出し分けは data-state を CSS 側で属性セレクタとして参照する。JS はここを書き換えるだけ -->
<body data-state="boot">

  <!-- 背景。漆器の面に見立てた、ごく浅い縦のグラデーションだけ -->
  <div id="bg" aria-hidden="true"></div>

  <!-- 背景の光条。円盤と逆向きにゆっくり回る。app.js が毎フレーム transform を書く。
       固定 600px を transform で拡大しているのは、画面サイズの要素をそのまま回すと
       ラスタライズ面積が跳ね上がってタブレットが持たないため。
       ここを等級の色で染めてはいけない（止まる前に答えが漏れる） -->
  <div id="rays" aria-hidden="true"></div>

  <!-- 待機中にゆっくり昇る金の粒。中身は app.js が起動時に一度だけ作る -->
  <div id="dust" aria-hidden="true"></div>

  <!-- 周囲を沈めて盤へ視線を集める。濃さは --vig（app.js が減速に合わせて書く）。
       光条より «手前» に無いと光条が沈まないので、必ず光条の後に置くこと -->
  <div id="vig" aria-hidden="true"></div>

  <!-- 画面全体の骨格。横向きは 円盤｜情報 の二段組、縦向きは上下に積む -->
  <div id="frame">

    <!-- 円盤ステージ -->
    <div id="stage">
      <canvas id="wheel-canvas"></canvas>
      <!-- 停止時の衝撃波。canvas の外まで広がるので DOM 側に置く（body.impact で走る） -->
      <div id="shock" aria-hidden="true"></div>
      <!-- 12時方向固定の指針。onTick のたびに .bump を付け外しして弾ませる -->
      <div id="pointer" aria-hidden="true"></div>
    </div>

    <!-- 情報側。景品の紹介と操作 -->
    <div id="panel">
      <div id="brand">
        <img id="logo" src="logo.png" alt="アツミ電氣株式会社">
        <div id="eyebrow">プライベート展示会 2026</div>
      </div>

      <button id="btn-start" type="button"><span>抽選する</span></button>
    </div>
  </div>

  <!-- 本日のノベルティ。画面下端を右から左へ流し続ける。
       «抽選する» の真上に等級付きで置くと «次はこれが当たる» と読まれるので、
       ここには等級を一切出さない。等級を言うのは結果画面だけ。
       中身は app.js が在庫のある品目から組み立てる -->
  <div id="ticker" aria-hidden="true">
    <div id="ticker-label">本日のノベルティ</div>
    <div id="ticker-view"><div id="ticker-track"></div></div>
  </div>

  <!-- 起動直後。Android の自動再生ポリシー対策で、最初のタップで音声を初期化する -->
  <div id="overlay-boot">
    <div class="boot-inner">
      <img class="boot-logo" src="logo.png" alt="アツミ電氣株式会社">
      <p>画面をタップして開始</p>
    </div>
  </div>

  <div id="overlay-result">
    <div class="result-inner">
      <!-- 並びは待機中の景品カードと揃える：絵 → 等級 → 品名 → 一言。
           «品名» が主役。等級を最大文字で先に出すと、6割の人の第一印象が「3等か」になる -->
      <div id="result-plate"><img id="result-img" alt=""></div>
      <div id="result-rank"></div>
      <div id="result-item"></div>
      <!-- 品目の一言。渡すときスタッフが読み上げる «台本» も兼ねる -->
      <div id="result-note"></div>
      <div id="result-actions">
        <button id="btn-close" type="button">円盤を見る</button>
        <button id="btn-next" type="button"><span>次の人へ</span></button>
      </div>
    </div>
  </div>

  <div id="overlay-finished">
    <p>本日の抽選は<br>終了しました</p>
  </div>

  <!-- 結果を退けているあいだだけ出る。もう一度結果に戻すためのボタン -->
  <button id="btn-reopen" type="button">結果を表示</button>

  <!-- 紙吹雪専用キャンバス。最前面かつクリックを奪わないよう pointer-events:none -->
  <canvas id="confetti-canvas"></canvas>

  <!-- 画面の縁が金色に燃える。画面上でいちばん大きい要素＝いちばん遠くから見える。
       等級の差は «光の量と長さ» で付ける（app.js が --edge-peak / --edge-dur を書く） -->
  <div id="edge" aria-hidden="true"></div>

  <!-- 1等演出用のフラッシュ -->
  <div id="flash" aria-hidden="true"></div>

  <!-- 右上の透明領域。1.5秒長押しでスタッフ用設定画面を開く（来場者には見えない） -->
  <div id="corner-hotspot"></div>

  <!-- settings.js が中身を描画する空コンテナ。body.settings-open のときだけ前面表示 -->
  <div id="settings-root"></div>

  <!-- 読み込み順は SPEC.md の契約どおり。type="module" は使わず素の script + window.NV -->
  <script src="js/defaults.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/lottery.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
