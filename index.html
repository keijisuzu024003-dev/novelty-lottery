<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 会場でのタップ操作前提。ピンチズームやダブルタップ拡大は誤操作の元なので禁止する -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B1437">
<link rel="manifest" href="manifest.webmanifest">
<title>ノベルティ抽選</title>
<link rel="stylesheet" href="app.css">
</head>
<!-- 画面の出し分けは data-state を CSS 側で属性セレクタとして参照する。JS はここを書き換えるだけ -->
<body data-state="boot">

  <!-- 背景。放射グラデ＋回転する光条は app.css だけで完結させる -->
  <div id="bg" aria-hidden="true"></div>

  <!-- 円盤ステージ。idle / spinning / result で表示する -->
  <div id="stage">
    <canvas id="wheel-canvas"></canvas>
    <!-- 12時方向固定のポインタ。onTick のたびに .bump を付け外しして弾ませる -->
    <div id="pointer" aria-hidden="true"></div>
    <div id="logo"><img src="logo.png" alt="アツミ電氣株式会社"></div>
  </div>

  <!-- 操作パネル。idle / spinning のみ表示（result 以降はオーバーレイに切り替わる） -->
  <div id="panel">
    <div id="headline">ノベルティ抽選</div>
    <button id="btn-start" type="button">スタート</button>
  </div>

  <!-- 起動直後。Android の自動再生ポリシー対策で、最初のタップで音声を初期化する -->
  <div id="overlay-boot">
    <p>画面をタップして開始</p>
  </div>

  <div id="overlay-result">
    <div id="result-rank"></div>
    <div id="result-item"></div>
    <div id="result-actions">
      <button id="btn-close" type="button">円盤を見る</button>
      <button id="btn-next" type="button">次の人へ</button>
    </div>
  </div>

  <div id="overlay-finished">
    <p>本日の抽選は終了しました</p>
  </div>

  <!-- 結果を退けているあいだだけ出る。もう一度結果に戻すためのボタン -->
  <button id="btn-reopen" type="button">結果を表示</button>

  <!-- 紙吹雪専用キャンバス。最前面かつクリックを奪わないよう pointer-events:none -->
  <canvas id="confetti-canvas"></canvas>

  <!-- 1等演出用の白フラッシュ -->
  <div id="flash" aria-hidden="true"></div>

  <!-- 右上の透明領域。1.5秒長押しでスタッフ用設定画面を開く（来場者には見えない） -->
  <div id="corner-hotspot"></div>

  <!-- settings.js が中身を描画する空コンテナ。body.settings-open のときだけ前面表示 -->
  <div id="settings-root"></div>

  <!-- 読み込み順は SPEC.md の契約どおり。type="module" は使わず素の script + window.NV -->
  <script src="js/defaults.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/lottery.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
